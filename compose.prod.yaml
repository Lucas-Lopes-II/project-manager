# Production on a single VM, using the images published by CI (ADR-0018 and ADR-0019).
x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    <<: *service
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina no .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *service
    image: ghcr.io/lucas-lopes-ii/project-manager-api:latest
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      # Checks every second while starting, so a new container is ready in about 1 s (ADR-0031).
      start_period: 30s
      start_interval: 1s

  web:
    <<: *service
    image: ghcr.io/lucas-lopes-ii/project-manager-web:latest
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
      # Checks every second while starting, so a new container is ready in about 1 s (ADR-0031).
      start_period: 30s
      start_interval: 1s

  caddy:
    <<: *service
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?defina no .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  db-data:
  caddy-data:
  caddy-config:
