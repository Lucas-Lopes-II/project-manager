server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Docker's DNS. Resolving on each request keeps /api working when the api container is recreated.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # Above the 5 MB of a cover, so that the API is the one that answers about the limit.
        client_max_body_size 6m;

        # The API is on the same Docker network, so a connection that takes long means the
        # container is being replaced. Failing fast also lets this container stop quickly.
        proxy_connect_timeout 2s;

        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File names in /assets carry a content hash, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
