# Limits per address for what comes through Caddy, which always sends X-Forwarded-For.
# Without Caddy, locally and in the E2E tests, the key is empty and nothing is limited (ADR-0035).
map $http_x_forwarded_for $limit_ip {
    ""      "";
    default $binary_remote_addr;
}

map $request_method $limit_write_ip {
    POST    $limit_ip;
    PUT     $limit_ip;
    PATCH   $limit_ip;
    DELETE  $limit_ip;
    default "";
}

map $request_method $limit_read_ip {
    POST    "";
    PUT     "";
    PATCH   "";
    DELETE  "";
    default $limit_ip;
}

limit_req_zone $limit_ip zone=site:10m rate=20r/s;
limit_req_zone $limit_read_ip zone=api_read:10m rate=10r/s;
limit_req_zone $limit_write_ip zone=api_write:10m rate=30r/m;
limit_conn_zone $limit_ip zone=per_ip:10m;

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Docker's DNS. Resolving on each request keeps /api working when the api container is recreated.
    resolver 127.0.0.11 valid=10s;

    # Only the Docker network, where Caddy is, can tell the address of the client. The rightmost
    # address it does not trust is the client, so a value sent by the browser is ignored.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_status 429;
    limit_conn_status 429;
    # The browser asks for every visible cover at once over HTTP/2, which Caddy forwards in parallel.
    limit_conn per_ip 100;
    limit_req zone=site burst=100 nodelay;

    location /api/ {
        limit_req zone=api_read burst=100 nodelay;
        limit_req zone=api_write burst=20 nodelay;
        error_page 429 = @too_many_requests;

        # Above the 5 MB of a cover, so that the API is the one that answers about the limit.
        client_max_body_size 6m;

        # The API is on the same Docker network, so a connection that takes long means the
        # container is being replaced. Failing fast also lets this container stop quickly.
        proxy_connect_timeout 2s;

        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The same error format as the API (ADR-0007).
    location @too_many_requests {
        default_type application/problem+json;
        return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Muitas requisições. Aguarde alguns segundos e tente novamente.","request_id":"$request_id"}\n';
    }

    # File names in /assets carry a content hash, so they never change.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
