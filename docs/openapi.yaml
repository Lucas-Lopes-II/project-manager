openapi: 3.1.0

info:
  title: Gerenciador de Projetos
  version: 1.0.0
  description: API para visualizar, adicionar, editar e remover projetos.

servers:
  - url: http://localhost:8080
    description: Ambiente local

security: []

tags:
  - name: Projetos
    description: Cadastro de projetos
  - name: Saúde
    description: Estado da API

paths:
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: Lista os projetos
      description: Retorna os projetos na ordem pedida, em ordem alfabética por padrão. O `total` sempre conta todos os projetos cadastrados, mesmo com filtro.
      tags: [Projetos]
      parameters:
        - name: favorite
          in: query
          description: Com `true`, retorna apenas os favoritos.
          schema:
            type: string
            enum: ["true"]
        - name: sort
          in: query
          description: |
            Ordem da lista. Os empates são desfeitos pelo nome.
            - `name`: nome, sem diferenciar maiúsculas e acentos. É o padrão.
            - `recent`: data de início, da mais recente para a mais antiga.
            - `deadline`: prazos de hoje em diante, do mais próximo ao mais distante, e depois os vencidos, do mais recente ao mais antigo. "Hoje" é a data em `America/Sao_Paulo`.
          schema:
            type: string
            enum: [name, recent, deadline]
            default: name
      responses:
        "200":
          description: Projetos encontrados e total de projetos cadastrados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createProject
      summary: Cria um projeto
      description: Aceita JSON, sem capa, ou `multipart/form-data`, com capa opcional. O projeto e a capa são gravados juntos.
      tags: [Projetos]
      requestBody:
        $ref: "#/components/requestBodies/ProjectCreate"
      responses:
        "201":
          description: Projeto criado.
          headers:
            Location:
              description: Caminho do projeto criado.
              schema:
                type: string
                example: /api/v1/projects/61705246-aacf-4373-875a-08f4dd31428c
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID do projeto. Um ID malformado responde 404.
        schema:
          type: string
          format: uuid
    get:
      operationId: getProject
      summary: Consulta um projeto
      tags: [Projetos]
      responses:
        "200":
          description: Projeto encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: updateProject
      summary: Substitui os campos de um projeto
      tags: [Projetos]
      description: Em JSON ou em formulário sem `cover` e sem `remove_cover`, a capa atual é mantida. Em formulário, `cover` troca a capa e `remove_cover` a remove, junto com os demais campos.
      requestBody:
        $ref: "#/components/requestBodies/ProjectUpdate"
      responses:
        "200":
          description: Projeto atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteProject
      summary: Remove um projeto definitivamente
      tags: [Projetos]
      responses:
        "204":
          description: Projeto removido.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/projects/{id}/cover:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProjectCover
      summary: Retorna a capa de um projeto
      description: O endereço informado em `cover_url` pode ficar em cache por um ano, porque muda a cada nova capa. Sem a versão atual em `v`, a resposta precisa ser revalidada.
      tags: [Projetos]
      parameters:
        - name: v
          in: query
          description: Versão da capa, informada em `cover_url`.
          schema:
            type: string
      responses:
        "200":
          description: Imagem da capa.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/CoverNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/projects/{id}/favorite:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: favoriteProject
      summary: Marca um projeto como favorito
      description: Repetir a chamada dá o mesmo resultado. Não altera o `updated_at`.
      tags: [Projetos]
      responses:
        "204":
          description: O projeto é favorito.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: unfavoriteProject
      summary: Desmarca um projeto como favorito
      description: Repetir a chamada dá o mesmo resultado. Não altera o `updated_at`.
      tags: [Projetos]
      responses:
        "204":
          description: O projeto não é favorito.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /health:
    get:
      operationId: getHealth
      summary: Informa se o processo está no ar
      tags: [Saúde]
      responses:
        "200":
          description: Processo no ar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"

  /ready:
    get:
      operationId: getReadiness
      summary: Informa se a API consegue usar o banco de dados
      tags: [Saúde]
      responses:
        "200":
          description: API pronta para uso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          description: Banco de dados indisponível.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  requestBodies:
    ProjectCreate:
      required: true
      description: Campos do projeto. O JSON tem limite de 1 MB, e o formulário comporta uma capa de até 5 MB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProjectInput"
        multipart/form-data:
          schema:
            allOf:
              - $ref: "#/components/schemas/ProjectInput"
              - type: object
                properties:
                  cover:
                    type: string
                    format: binary
                    description: Imagem JPEG ou PNG de até 5 MB. O formato é identificado pelo conteúdo do arquivo.

    ProjectUpdate:
      required: true
      description: Campos do projeto. O JSON tem limite de 1 MB, e o formulário comporta uma capa de até 5 MB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProjectInput"
        multipart/form-data:
          schema:
            allOf:
              - $ref: "#/components/schemas/ProjectInput"
              - type: object
                properties:
                  cover:
                    type: string
                    format: binary
                    description: Imagem JPEG ou PNG de até 5 MB, que substitui a capa atual.
                  remove_cover:
                    type: string
                    enum: ["true"]
                    description: Remove a capa atual. É ignorado quando `cover` também é enviado.

  responses:
    BadRequest:
      description: O corpo da requisição não é um JSON ou um formulário válido.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidFilter:
      description: O valor de um filtro da listagem é inválido.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Projeto não encontrado.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CoverNotFound:
      description: O projeto não existe ou não tem capa.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ContentTooLarge:
      description: O corpo da requisição excede o limite do seu formato.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationFailed:
      description: Um ou mais campos são inválidos.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Unprocessable Entity
            status: 422
            detail: Um ou mais campos são inválidos.
            request_id: FHGJTHJDNHP2NJACCDEGN7JBZN
            errors:
              - field: name
                code: min_words
              - field: start_date
                code: invalid_date_range
              - field: end_date
                code: invalid_date_range
    InternalError:
      description: Erro inesperado, sem detalhes internos.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    ProjectInput:
      type: object
      required: [name, client, start_date, end_date]
      properties:
        name:
          type: string
          description: Ao menos 2 palavras e até 120 caracteres.
          maxLength: 120
          example: Projeto Iridium
        client:
          type: string
          description: Ao menos 1 palavra e até 120 caracteres.
          maxLength: 120
          example: Clicksign
        start_date:
          type: string
          format: date
          example: "2026-11-04"
        end_date:
          type: string
          format: date
          description: Precisa ser posterior a `start_date`.
          example: "2026-12-12"

    Project:
      type: object
      required: [id, name, client, start_date, end_date, favorite, cover_url, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          example: 61705246-aacf-4373-875a-08f4dd31428c
        name:
          type: string
          example: Projeto Iridium
        client:
          type: string
          example: Clicksign
        start_date:
          type: string
          format: date
          example: "2026-11-04"
        end_date:
          type: string
          format: date
          example: "2026-12-12"
        favorite:
          type: boolean
          example: false
        cover_url:
          type: [string, "null"]
          description: Endereço da capa, ou `null` quando o projeto não tem capa.
          example: /api/v1/projects/61705246-aacf-4373-875a-08f4dd31428c/cover?v=1793816515000000
        created_at:
          type: string
          format: date-time
          example: "2026-11-04T18:21:55Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-11-04T18:21:55Z"

    ProjectList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        total:
          type: integer
          description: Quantidade de projetos cadastrados.
          example: 1

    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    Problem:
      type: object
      description: Erro no formato da RFC 9457.
      required: [type, title, status, request_id]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: Projeto não encontrado.
        request_id:
          type: string
          description: Identificador da requisição, também presente nos logs.
          example: FHGJTHJDNHP2NJACCDEGN7JBZN
        errors:
          type: array
          description: Campos inválidos, presente só nos erros de validação.
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          enum: [name, client, start_date, end_date, cover]
        code:
          type: string
          description: |
            - `min_words`: menos palavras que o mínimo do campo.
            - `max_length`: mais de 120 caracteres.
            - `invalid_date`: data ausente ou inválida.
            - `invalid_date_range`: a data final não é posterior à inicial.
            - `invalid_image`: o arquivo não é uma imagem JPEG ou PNG.
            - `max_size`: a imagem tem mais de 5 MB.
          enum: [min_words, max_length, invalid_date, invalid_date_range, invalid_image, max_size]
